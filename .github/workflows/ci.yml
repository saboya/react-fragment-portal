name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
        react-version: [18.2.0, 19.2.0]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Install target React version
      run: npm install --no-save react@${{ matrix.react-version }} react-dom@${{ matrix.react-version }}

    - name: Run build
      run: npm run build

    - name: Run tests
      run: npm run test
